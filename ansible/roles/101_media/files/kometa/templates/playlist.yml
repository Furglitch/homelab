templates:

  flicklist-list:
    minimum_items: 2
    libraries: Movies, TV Shows
    sync_to_users: all
    optional:
      - url_poster
      - ignore
    ignore_ids: <<ignore>>
    sonarr_add_missing: false
    radarr_add_missing: false
    flicklist_list: "https://flicklist.tv/<<list_path>>"
    url_poster: "<<poster>>"
    conditionals:
      list_path:
        default: "lists/<<list_name>>"
        conditions:
          - list_author.exists: true
            value: "u/<<list_author>>/lists/<<list_name>>"
      poster:
        conditions:
          - poster_id.exists: true
            value: "https://theposterdb.com/api/assets/<<poster_id>>"


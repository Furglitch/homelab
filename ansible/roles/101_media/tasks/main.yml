---
- name: Create config directory structure
  ansible.builtin.file:
    path: "{{ files.docker.config }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ paths | default([]) | list }}"

- name: Ensure config paths are writable by containers
  ansible.builtin.file:
    path: "{{ files.docker.config }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0775"
    recurse: true

- name: Create data directory structure
  ansible.builtin.file:
    path: "{{ files.docker.data }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ paths | default([]) | list }}"

- name: Ensure data paths are writable by containers
  ansible.builtin.file:
    path: "{{ files.docker.data }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0775"
    recurse: true

- name: Remove stale default compose filenames
  ansible.builtin.file:
    path: "{{ files.docker.root }}/{{ item }}"
    state: absent
  loop:
    - compose.yml
    - compose.yaml
    - docker-compose.yaml

- name: Render Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ files.docker.root }}/docker-compose.yml"
    mode: "0644"
    force: true

- name: Copy Kometa config files
  ansible.builtin.copy:
    src: kometa/
    dest: "{{ files.docker.config }}/kometa/"
    mode: "0644"

- name: Render Kometa config template
  ansible.builtin.template:
    src: kometa.yml.j2
    dest: "{{ files.docker.config }}/kometa/config.yml"
    mode: "0644"

- name: Render Recyclarr config template
  ansible.builtin.template:
    src: recyclarr.yml.j2
    dest: "{{ files.docker.config }}/recyclarr/recyclarr.yml"
    mode: "0644"

- name: Deploy stack
  community.docker.docker_compose_v2:
    project_src: "{{ files.docker.root }}"
    files:
      - docker-compose.yml
    state: present
    pull: always

---
- name: Create Pelican Docker directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ files.docker_path }}"
    - "{{ files.docker_config_path }}"
    - "{{ files.docker_data_path }}"
    - "{{ files.docker_data_path }}/pelican/database"
    - "{{ files.docker_data_path }}/pelican/panel/var"
    - "{{ files.docker_data_path }}/pelican/panel/nginx"
    - "{{ files.docker_data_path }}/pelican/panel/certs"
    - "{{ files.docker_data_path }}/pelican/panel/logs"
    - /etc/pelican
    - /var/lib/pelican
    - /var/log/pelican
    - /tmp/pelican

- name: Create MySQL client config to disable SSL for panel container
  ansible.builtin.copy:
    content: |
      [client]
      ssl=false
    dest: "{{ files.docker_data_path }}/pelican/panel/mysql-no-ssl.cnf"
    mode: "0644"

- name: Render Pelican Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ files.docker_path }}/docker-compose.yml"
    mode: "0644"
    force: true

- name: Remove stale default compose filenames
  ansible.builtin.file:
    path: "{{ files.docker_path }}/{{ item }}"
    state: absent
  loop:
    - compose.yml
    - compose.yaml
    - docker-compose.yaml

- name: Render Wings config
  ansible.builtin.template:
    src: wings-config.yml.j2
    dest: /etc/pelican/config.yml
    mode: "0600"
    force: false
  when:
    - pelican.wings_node_uuid != ""
    - pelican.wings_token_id != ""
    - pelican.wings_token != ""

- name: Deploy Pelican stack
  community.docker.docker_compose_v2:
    project_src: "{{ files.docker_path }}"
    files:
      - docker-compose.yml
    state: present
    pull: always
